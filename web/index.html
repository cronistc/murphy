<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritório Pixel</title>
<style>
  :root {
    --fundo: #17141c; --painel: #221e29; --painel2: #2b2633; --borda: #3a3344;
    --texto: #ece6f2; --suave: #a39cae; --destaque: #f2b84b; --ok: #5fc27e; --perigo: #e5675f;
    --opus: #9b6ae0; --sonnet: #4a8ae8; --haiku: #4cbf6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; min-height: 100vh; }
  #palco { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 16px; gap: 10px; }
  #tela { image-rendering: pixelated; border-radius: 6px; box-shadow: 0 10px 40px #0008; cursor: default; max-width: 100%; }
  #dica { color: var(--suave); font-size: 12px; text-align: center; }
  aside { width: 360px; flex-shrink: 0; background: var(--painel); border-left: 1px solid var(--borda);
    overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  section { padding: 14px 16px; border-bottom: 1px solid var(--borda); }
  h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 0 0 10px; }
  .pilula { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--painel2); color: var(--suave); }
  .pilula.on { color: var(--ok); } .pilula.off { color: var(--perigo); }
  #status { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  label { display: block; font-size: 12px; color: var(--suave); margin: 8px 0 3px; }
  input, select, textarea { width: 100%; background: var(--fundo); color: var(--texto); border: 1px solid var(--borda);
    border-radius: 6px; padding: 7px 9px; font: inherit; }
  textarea { min-height: 76px; resize: vertical; }
  .linha { display: flex; gap: 8px; } .linha > * { flex: 1; }
  button { background: var(--destaque); color: #241a05; border: 0; border-radius: 6px; padding: 8px 12px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button.neutro { background: var(--painel2); color: var(--texto); border: 1px solid var(--borda); font-weight: 500; }
  button.perigo { background: var(--perigo); color: #fff; }
  #delegar button[type=submit] { width: 100%; margin-top: 10px; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--suave); }
  .chk input { width: auto; }
  #erroForm { color: var(--perigo); font-size: 12px; margin-top: 6px; min-height: 1em; }
  .pedido { background: var(--painel2); border: 1px solid var(--destaque); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .pedido code { display: block; margin: 6px 0 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; color: var(--suave); }
  .pedido .linha button { padding: 6px; }
  .vazio { color: var(--suave); font-size: 12px; }
  .feed { font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .feed details { border-bottom: 1px dashed var(--borda); padding: 3px 0; }
  .feed summary { cursor: pointer; list-style: none; word-break: break-word; }
  .feed summary::-webkit-details-marker { display: none; }
  .feed pre { white-space: pre-wrap; word-break: break-all; background: var(--fundo); padding: 6px; border-radius: 4px; margin: 4px 0; color: var(--suave); }
  .hora { color: var(--suave); }
  .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  #ficha .topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #ficha .nome { font-weight: 700; font-size: 15px; }
  #ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 8px 0; }
  #ficha dt { color: var(--suave); } #ficha dd { margin: 0; word-break: break-all; }
  #ficha .feed { max-height: 320px; overflow-y: auto; }
  #atividade .feed { max-height: 260px; overflow-y: auto; }
  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; border-left: 0; border-top: 1px solid var(--borda); }
    #palco { padding: 8px; }
  }
</style>
</head>
<body>
<main id="palco">
  <canvas id="tela" width="384" height="224" aria-label="Escritório"></canvas>
  <div id="dica">Clique num funcionário para ver o que ele está fazendo e o log técnico.</div>
</main>
<aside>
  <section>
    <h1>🏢 Escritório Pixel</h1>
    <div id="status">
      <span class="pilula" id="conexao">conectando…</span>
      <span class="pilula" id="trabalhando">0 trabalhando</span>
      <span class="pilula" id="cota" hidden></span>
    </div>
  </section>

  <section id="secPedidos">
    <h2>Pedidos na sua mesa</h2>
    <div id="pedidos"><div class="vazio">Ninguém esperando por você.</div></div>
  </section>

  <section>
    <h2>Delegar tarefa</h2>
    <form id="delegar">
      <label for="fNome">Funcionário</label>
      <input id="fNome" list="nomes" placeholder="ex.: ana" required autocomplete="off">
      <datalist id="nomes"></datalist>
      <div class="linha">
        <div>
          <label for="fModelo">Cargo</label>
          <select id="fModelo">
            <option value="haiku">Júnior (Haiku)</option>
            <option value="sonnet" selected>Pleno (Sonnet)</option>
            <option value="opus">Sênior (Opus)</option>
          </select>
        </div>
      </div>
      <label for="fTarefa">Tarefa</label>
      <textarea id="fTarefa" required placeholder="ex.: crie uma página HTML de lista de tarefas com testes"></textarea>
      <label for="fProjeto">Projeto (pasta)</label>
      <input id="fProjeto" required autocomplete="off">
      <button type="submit">Delegar</button>
      <div id="erroForm"></div>
      <label class="chk"><input type="checkbox" id="fAuto"> Aprovar pedidos automaticamente (nunca fora da pasta do projeto)</label>
    </form>
  </section>

  <section id="ficha" hidden></section>

  <section id="atividade">
    <h2>Atividade</h2>
    <div class="feed" id="feed"></div>
  </section>
</aside>
<script type="module" src="jogo.js"></script>
</body>
</html>
