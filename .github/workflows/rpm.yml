# Gera o pacote do Fedora. Em tag v* (ex.: git tag v0.1.0 && git push origin v0.1.0)
# também publica a versão em Releases com o .rpm anexado.
name: Pacote Fedora

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run checar
      - run: npm run rpm
      - uses: actions/upload-artifact@v4
        with:
          name: escritorio-pixel-rpm
          path: build/*.rpm
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.rpm --title "Escritório Pixel ${GITHUB_REF_NAME#v}" --generate-notes
